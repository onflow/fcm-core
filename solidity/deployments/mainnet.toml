# Market liquidation LTV (WAD, 1e18 = 100%). 0.86e18 = 86%.
marketLltv   = "860000000000000000"

# --- Rebalance band (1e18-scaled LTV, 1e18 = 100%) ---
# LTV = debtInCollateral / collateral. Higher LTV is more leveraged.
# `rebalance()` acts only outside the [LTV_MIN, LTV_MAX] band and returns
# the position to the re-entry target just inside the breached bound:
#   ltv < LTV_MIN -> lever   up   to LTV_MIN_TARGET (just above min)
#   ltv > LTV_MAX -> delever down to LTV_MAX_TARGET (just below max)
# Ordering: 0 < LTV_MIN <= LTV_MIN_TARGET <= LTV_MAX_TARGET <= LTV_MAX < marketLltv.
ltvMin = "700000000000000000"        # 0.7e18   (70%)
ltvMinTarget = "699000000000000000"   # 0.699e18 (69.9%)
ltvMaxTarget = "601000000000000000"   # 0.601e18 (60.1%)
ltvMax = "600000000000000000"        # 0.6e18   (60%)

yieldToLoanMax = "1010000000000000000"  # 1.01e18 (101%)

# --- FlowSwap V3 pool fee tiers ---
# Pool addresses are derived from swapFactory + these fees in ConfiguredScript.
yieldLoanPoolFee = 100
collateralLoanPoolFee = 3000

